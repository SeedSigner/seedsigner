name: CI

on:
  push:
  pull_request:

# Explicitly restrict the auto-provisioned GITHUB_TOKEN to the least privilege required
# for this workflow.
permissions:
  contents: read

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Used by the `Version` class so it can identify the current fork
  PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}

  # Used by `Version`. We want the PR author's latest commit hash if this is a PR
  # but the default SHA env var reflects a new commit into the target repo.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Fail instead of re-resolving if uv.lock is out of date with pyproject.toml. Applies
  # to every uv invocation, including the nested `uv run` that `poe` performs.
  UV_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.10: minimum supported version (requires-python in pyproject.toml)
        # 3.12: what SeedSigner OS ships (CPython 3.12.10)
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Needs to also pull the seedsigner-translations repo
          submodules: recursive
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get install libzbar0
          # Installs exactly the artifacts recorded in uv.lock (sha256-verified): the
          # runtime deps, the default `dev` group (test + l10n tools) and the project
          # itself in editable mode.
          uv sync --locked
      - name: Compile translations
        run: uv run poe translations-compile
      - name: Test with pytest
        run: |
          mkdir -p artifacts
          uv run poe test \
            --color=yes \
            --cov=seedsigner \
            --cov-branch \
            --durations 5 \
            -vv
      - name: Generate screenshots
        run: |
          uv run poe screenshots \
            --color=yes \
            --cov=seedsigner \
            --cov-append \
            --cov-branch \
            --cov-report html:./artifacts/cov_html \
            -vv
          cp -r ./seedsigner-screenshots ./artifacts/
      - name: Coverage report
        run: uv run coverage report
      - name: Archive CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.python-version }}
          path: artifacts/**
          retention-days: 10
        # Upload also when tests fail. The workflow result (red/green) will
        # not be affected by this.
        if: always()
